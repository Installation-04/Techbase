name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # A real Postgres for the database tests (backend/test/helpers/pg.js creates
    # a throwaway database per test file from this server).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: techbase
          POSTGRES_PASSWORD: techbase
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://techbase:techbase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Netlify's function bundler only resolves deps from the site's top-level
  # package.json (not backend/node_modules) — this catches that class of
  # bundling failure before it reaches a real Netlify deploy.
  functions-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx esbuild netlify/functions/api.js --bundle --platform=node --target=node20 --outfile=/tmp/api-bundle.js
      - run: npx esbuild netlify/functions/maintenance-scheduler.js --bundle --platform=node --target=node20 --outfile=/tmp/maintenance-bundle.js
