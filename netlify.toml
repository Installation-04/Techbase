[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist"
  # Netlify does not build this project any more (releases ship as Docker
  # images, see README): an `ignore` command that exits 0 tells Netlify to skip
  # the build in every context - production, deploy previews and branch
  # deploys. The site keeps serving its last deploy. To build on Netlify again,
  # delete this line.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback so client-side routes (e.g. /clients/1) resolve on refresh.
# Function routing for /api/* is defined via the `config.path` export in
# netlify/functions/api.js and takes priority over this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
