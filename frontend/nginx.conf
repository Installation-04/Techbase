# Use the protocol the *browser* spoke when another proxy (e.g. the optional
# Caddy HTTPS container) already terminated TLS in front of us; otherwise our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Recover the real client address from X-Forwarded-For, but only when the
# request comes from another container on a Docker network — never trust the
# header from the open internet. The API's rate limiter keys on this address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        # nginx's 1m default rejects document uploads before they reach the
        # API; keep in step with the multer limit in backend/src/routes/documents.js.
        client_max_body_size 50m;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell must always be revalidated so a new deploy is picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
