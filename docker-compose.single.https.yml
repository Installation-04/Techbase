# Optional: HTTPS with automatic certificates (Caddy) in front of the all-in-one container.
# Same idea as docker-compose.https.yml: set DOMAIN and PUBLIC_URL in .env, add this file
# at the end of COMPOSE_FILE in .env, then `docker compose up -d`.
services:
  techibase:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set in .env (for example app.example.com)}
    volumes:
      - ./Caddyfile.single:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      techibase:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
