name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Netlify's function bundler only resolves deps from the site's top-level
  # package.json (not backend/node_modules) — this catches that class of
  # bundling failure before it reaches a real Netlify deploy.
  functions-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx esbuild netlify/functions/api.js --bundle --platform=node --target=node20 --outfile=/tmp/api-bundle.js
      - run: npx esbuild netlify/functions/maintenance-scheduler.js --bundle --platform=node --target=node20 --outfile=/tmp/maintenance-bundle.js
