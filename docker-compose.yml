# TechIBase — the whole platform in containers:
#   db         PostgreSQL
#   backend    the API (Express)
#   scheduler  the daily jobs (preventive work orders + admin email digest)
#   frontend   the web app (nginx), also the single public entry point
#
# First install:  ./install.sh   (creates .env with random secrets, builds, starts)
# Afterwards:     docker compose up -d --build

# Settings shared by every container that talks to the database or sends mail.
x-common-env: &common-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-techbase}
  DB_USER: ${DB_USER:-techbase}
  DB_PASSWORD: ${DB_PASSWORD:-changeme}
  NODE_ENV: ${NODE_ENV:-production}
  TZ: ${TZ:-UTC}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-TechIBase <onboarding@resend.dev>}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-techbase}
      POSTGRES_USER: ${DB_USER:-techbase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Over TCP on purpose: during first-run initialisation Postgres only
      # listens on its unix socket, so a socket check reports "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ./backend
    image: techibase-backend
    restart: unless-stopped
    init: true
    environment:
      <<: *common-env
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set in .env - on a new install run ./install.sh, on an existing install keep your current value because changing it makes stored passwords unreadable}"
      UPLOADS_DIR: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      ACUMATICA_BASE_URL: ${ACUMATICA_BASE_URL:-}
      ACUMATICA_USERNAME: ${ACUMATICA_USERNAME:-}
      ACUMATICA_PASSWORD: ${ACUMATICA_PASSWORD:-}
      ACUMATICA_COMPANY: ${ACUMATICA_COMPANY:-}
      ACUMATICA_BRANCH: ${ACUMATICA_BRANCH:-}
      ACUMATICA_ENDPOINT_NAME: ${ACUMATICA_ENDPOINT_NAME:-Default}
      ACUMATICA_ENDPOINT_VERSION: ${ACUMATICA_ENDPOINT_VERSION:-24.200.001}
    # No published port: the API is reached only through the frontend (nginx).
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    logging: *default-logging

  scheduler:
    build: ./backend
    image: techibase-backend
    restart: unless-stopped
    init: true
    command: ["node", "src/scheduler.js"]
    # The image's healthcheck probes the API port, which this process doesn't serve.
    healthcheck:
      disable: true
    environment:
      <<: *common-env
      SCHEDULER_TIME: ${SCHEDULER_TIME:-06:00}
      RUN_ON_START: ${RUN_ON_START:-false}
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  db_data:
  uploads:
